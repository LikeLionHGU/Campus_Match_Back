# 비밀값은 여기에 적지 않고 환경변수(.env)로 주입한다.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/campusmatch?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# 프론트엔드(Campus_Match_Front)가 Authorization / RefreshToken 헤더를 사용한다.
external:
  jwt:
    tokenSecretKey: ${JWT_SECRET}
    tokenPrefix: "Bearer "
    accessKey: Authorization
    accessTokenExpirationTime: ${JWT_ACCESS_EXPIRATION_MS:1800000}      # 30분
    refreshKey: RefreshToken
    refreshTokenExpirationTime: ${JWT_REFRESH_EXPIRATION_MS:1209600000} # 14일 (Integer 최대치 약 24일)

# 업로드 파일 저장 위치와 외부에서 접근할 주소 (URL = public-url + /files/...)
file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  public-url: ${FILE_PUBLIC_URL:http://localhost:8080}
